<script type="text/markdown" class="report-src">
# Informe 12 — Situación real y mejoras previstas

> Este informe es una **autoevaluación honesta**: en qué punto está Libitum de verdad, qué aguanta, qué limitaciones tiene y cuál es la hoja de ruta. Conocer lo que falta es tan importante como lo que está hecho.

---

## 1. ¿En qué punto está? (resumen honesto)

Libitum está en estado de **MVP sólido / listo para piloto**. Es una aplicación **completa y funcional**, desplegada y usable con usuarios reales:

- ✅ **Funcionalidad completa:** registro con verificación, login, recuperar contraseña, roles, eventos (con estado automático), seguir artistas, feed, búsqueda, asistencias con recordatorios por email, donaciones (enlace/Bizum), panel admin, PWA instalable.
- ✅ **Desplegada de verdad** (Vercel + Railway + Neon + Brevo), por HTTPS.
- ✅ **Con seguridad pensada para datos reales** (tokens, verificación, rate-limit, CORS, RGPD).
- ✅ **Con tests** que protegen el backend.

No es un prototipo de clase "que solo funciona en local": **funciona en internet y se puede recomendar a artistas reales** para un piloto.

---

## 2. ¿Cuánta gente aguanta? (capacidad real)

La clave es distinguir **usuarios totales** de **usuarios a la vez**:

- **Usuarios registrados:** pueden ser **miles** sin problema (es solo espacio en la base de datos).
- **Usuarios simultáneos** (haciendo clic en el mismo momento): **ese es el límite real**, porque el backend usa un servidor de desarrollo (`php artisan serve`) que atiende de una en una.

| Gente usándolo a la vez | Cómo va |
|---|---|
| Hasta ~20-30 simultáneos | Suave |
| ~30-80 simultáneos | Usable, algún pico lento |
| 100+ en el MISMO instante | Se atasca → tocaría servidor de producción |

> El frontend (Vercel) escala "infinito" (es un CDN); el cuello de botella es solo el backend cuando muchos piden datos a la vez. Para el piloto y la presentación, **va sobrado**.

---

## 3. Coste de mantenimiento

- **Vercel, Neon y Brevo:** capa **gratuita** suficiente para empezar.
- **Railway:** el plan **Hobby (~5 €/mes)** da CPU decente, quita el límite de crédito, permite elegir **región Europa** (más rápido) y el **volumen** para que las imágenes persistan.

Con **~5 €/mes** la app se mantiene cómoda para un uso real de piloto.

---

## 4. Limitaciones conocidas (honestidad total)

Para que no me pillen, estas son las cosas a mejorar:

| Limitación | Detalle |
|---|---|
| **Servidor de desarrollo** | `php artisan serve` atiende de una en una; para mucho tráfico simultáneo habría que pasar a php-fpm/Nginx o Laravel Octane |
| **Sin tests de frontend** | El backend está bien cubierto; el frontend se ha probado a mano + ESLint |
| **Sin monitorización ni backups propios** | No hay alertas de errores (Sentry) ni copias de seguridad automáticas más allá de las de Neon |
| **Arranques fríos de la BD** | La capa gratis de Neon "duerme" tras inactividad; la primera carga tras un rato es algo más lenta |
| **Imagen de compartir genérica** | Al compartir, sale la imagen de marca de Libitum, no la portada concreta de cada evento (eso necesitaría renderizado en servidor) |

Ninguna impide el uso real para un piloto; son cosas de **escalar y endurecer**.

---

## 5. Hoja de ruta (mejoras previstas)

### Técnicas (para escalar y robustez)
- **Servidor de producción real** (php-fpm + Nginx o Laravel Octane) en lugar de `artisan serve`.
- **Monitorización de errores** (Sentry) y **backups** de la base de datos.
- **Mantener la BD despierta** (un ping periódico o Neon de pago) para quitar los arranques fríos.
- **Tests de frontend** (Vitest + React Testing Library).

### De producto (nuevas funcionalidades)
- **Imagen de compartir por evento** (su portada al compartir el enlace).
- **Notificaciones push** (aprovechando que ya es PWA) además de los emails.
- **Estadísticas más ricas** para el artista.
- **Mejoras en el descubrimiento** (recomendaciones, eventos cercanos por geolocalización).
- **Moderación / reportes** más completos en el panel admin.

---

## 6. Conclusión honesta

Libitum **no está "verde" ni es un juguete**: es un **producto funcional, desplegado y seguro**, listo para que un grupo de artistas lo use de verdad en eventos reales, por ~5 €/mes.

Lo que le separa de un "SaaS comercial a gran escala" es trabajo de **endurecimiento** (servidor de producción, monitorización, backups, tests de frontend), no de **funcionalidad**. La base está bien hecha y la hoja de ruta es clara.

# Informe 13 — Monetización (enfoque empresarial)

> Este informe explica **cómo podría ganar dinero Libitum** y, sobre todo, la **filosofía de negocio** detrás: monetizar **sin perjudicar al artista**. No es un plan de empresa cerrado, sino el modelo y las vías que tienen sentido para este proyecto.

---

## 1. La filosofía: no quitarle dinero al artista

La decisión de negocio más importante es **deliberada**: Libitum **NO procesa las donaciones** ni se queda comisión de ellas. Cuando alguien apoya a un artista, el dinero va **directo** del donante al artista por su plataforma (PayPal, Ko-fi, Bizum…). Libitum solo conecta y muestra.

¿Por qué?
- **Por el artista:** el artista de calle vive de poco; quitarle una comisión de cada propina sería injusto y le echaría para atrás.
- **Por simplicidad legal:** ser pasarela de pago implica obligaciones legales y técnicas enormes (licencias, antifraude, fiscalidad). Evitarlo mantiene el proyecto viable.

**Consecuencia:** como las donaciones no son una vía de ingreso, la monetización tiene que venir de **otros sitios** que aporten valor sin restar al artista.

---

## 2. Vías de monetización actuales (implementadas)

### 2.1. Merchandising del QR
- **Qué:** fabricar material físico con el **QR del artista** (pegatinas, láminas, carteles, chapas) para que la gente lo encuentre y lo siga en la calle.
- **Por qué funciona:** le da al artista algo **tangible y útil** (su QR en la funda de la guitarra, en el local…), y a Libitum un ingreso por la venta/fabricación.
- **Cómo está montado:** una sección de merchandising en la página de Contacto, donde el artista lo solicita por correo.

### 2.2. Apoyo a los desarrolladores
- **Qué:** un botón discreto **"✨ Apoya el proyecto"** con un enlace de donación (PayPal) para quien quiera ayudar a mantener la web.
- **Por qué:** cubre los **costes de mantenimiento** (los ~5 €/mes del hosting) de forma voluntaria, sin meter publicidad ni comisiones.

---

## 3. Vías de monetización futuras (ideas de negocio)

Pensando a futuro, sin romper la filosofía de no cobrar al artista por sus propinas:

| Vía | En qué consiste |
|---|---|
| **Freemium para artistas** | Cuenta gratis con lo esencial; cuenta "pro" de pago con extras: estadísticas avanzadas, página personalizada, más eventos destacados… |
| **Eventos destacados** | El artista puede pagar (poco) por **destacar** un evento concreto en el feed/búsqueda durante unos días |
| **Comisión del merchandising** | El margen de la venta del material físico (no de las propinas) |
| **Acuerdos con locales** | Bares, salas y festivales que paguen por aparecer o por promocionar sus eventos |
| **Patrocinios locales** | Marcas que apoyen la cultura de calle a cambio de visibilidad discreta |

> El hilo común: el artista **siempre puede usar lo esencial gratis** y quedarse el 100% de sus donaciones; se cobra por **servicios de valor añadido** (merch, destacar, herramientas pro), no por su dinero.

---

## 4. Por qué este modelo tiene sentido

```mermaid
flowchart LR
    A[Artista gana más<br/>100% de sus propinas] --> U[Usa y recomienda Libitum]
    U --> P[Más artistas y público]
    P --> M[Más demanda de merch<br/>y servicios pro]
    M --> I[Ingresos para Libitum]
    I --> A
```

Es un modelo **alineado**: Libitum gana **cuando el artista gana**. Si el artista prospera, usa más la plataforma, atrae público, y eso genera demanda de los servicios de pago (merch, pro). No es un modelo extractivo (quitarle al artista), sino de **crecer juntos**.

---

## 5. Costes vs ingresos (realista)

- **Costes actuales:** mínimos (~5 €/mes de hosting). El proyecto es **sostenible desde el primer momento** con muy poco.
- **Primeros ingresos realistas:** el **merchandising** es la vía más inmediata y concreta para empezar a generar algo, sin necesidad de mucha escala.
- **Escalabilidad del negocio:** las vías de pago (freemium, destacados) solo tienen sentido **con masa de usuarios**; son para más adelante, cuando haya comunidad.

---

## 6. Resumen

- Decisión clave: **no cobrar comisión de las donaciones** (el artista se queda el 100%) → ni perjudica al artista ni nos convierte en pasarela de pago.
- Monetización por **valor añadido**: **merchandising** del QR (ya montado) y **apoyo voluntario** a los devs.
- A futuro: **freemium**, **eventos destacados**, **comisión de merch** y **acuerdos con locales/patrocinios**.
- Modelo **alineado**: Libitum gana cuando el artista gana.

# Informe 14 — Impacto en los artistas y planteamiento de pagos

> Este es el informe de cierre: el **porqué humano** del proyecto. Explica para quién está pensado Libitum, cómo cada decisión gira en torno al artista, y todo el razonamiento detrás de los **pagos y donaciones** (lo más cuidado del proyecto).

---

## 1. El problema real que resuelve

Un artista de calle toca, la gente disfruta… y se va. No hay forma fácil de **seguirle, saber dónde tocará la próxima vez, ni apoyarle** más allá de las monedas que caen en el momento. La conexión se pierde.

Libitum existe para **cerrar esa brecha**:
- El artista tiene una **página propia** y un **QR** que reparte.
- La gente lo **escanea**, lo **sigue**, se entera de sus próximos eventos y puede **apoyarle** aunque ya no esté delante.

El impacto buscado: que la **cultura de calle no se quede en el momento**, sino que se convierta en una comunidad que apoya a sus artistas de forma continuada.

---

## 2. Diseñar pensando en el artista de calle

Cada decisión grande del proyecto se tomó **poniéndome en su lugar**:

| Decisión | Pensando en que el artista… |
|---|---|
| **Estado del evento automático** | …está tocando, no mirando el móvil para marcar "en directo" |
| **QR + merchandising físico** | …vive en la calle: necesita que le encuentren ahí, no solo online |
| **Donación voluntaria** | …trabaja "a la gorra": gratis pero con opción de colaborar |
| **Bizum** | …a lo mejor no tiene PayPal ni Ko-fi, pero sí un móvil |
| **Guía de pagos** | …no tiene por qué saber de comisiones; le explico cómo ganar más |
| **No cobrar comisión** | …necesita cada euro; no se lo quito |

---

## 3. El planteamiento de los pagos (lo más cuidado)

Aquí está el detalle que demuestra que el proyecto **piensa de verdad** en el artista.

### 3.1. Varias formas de cobrar (cubrir a todo el mundo)
No todos los artistas ni todos los donantes son iguales, así que ofrezco **varias vías**:
- **Enlace de pago** (Ko-fi, PayPal, Buy Me a Coffee…): para quien quiera pagar con tarjeta online.
- **Bizum**: directo, instantáneo y muy usado en España.

### 3.2. El mínimo de 1 € (un detalle que importa de verdad)
- **El problema:** en donaciones muy pequeñas por **PayPal/tarjeta**, la **comisión se lo come casi todo**. Una donación de 0,10 € puede dejarle al artista **0 €**.
- **La solución:** avisar de que se done **desde 1 €** (donde la comisión ya deja ~0,60 € al artista). Con **Bizum no pasa** (no tiene comisión), así que ahí vale cualquier cantidad.
- Este aviso aparece junto al botón de donar y se explica en la **guía de pagos**.

### 3.3. Recomendar la mejor plataforma
- Recomiendo **Ko-fi** (con Stripe): el donante **paga con tarjeta sin crear cuenta** y **sin comisión** de plataforma.
- Aviso de que **PayPal** cobra comisión y a veces obliga al donante a registrarse (fricción que reduce las donaciones).
- Objetivo: que el artista elija con criterio y **gane más**.

### 3.4. Bizum bajo su responsabilidad
- El Bizum expone su **número de móvil** públicamente, así que se le **avisa** y lo activa **voluntariamente**. Transparencia total.

---

## 4. El QR y el merchandising: del online a la calle

El **QR** es la pieza que une el mundo físico con la app: el artista lo enseña/reparte mientras toca, y quien lo escanea entra a su página. Para potenciarlo, Libitum ofrece **merchandising** con ese QR (pegatinas, láminas…) para que el artista lo lleve a la funda de su instrumento, lo pegue donde toca y la gente lo encuentre incluso cuando él no está.

Es un círculo: **la calle lleva a la app, y la app mantiene la conexión** cuando la actuación termina.

---

## 5. El impacto en una frase

> Libitum convierte un **momento** (ver a un artista en la calle) en una **relación** (seguirle, apoyarle, no perderse sus directos), y lo hace **sin quitarle nada al artista**.

---

---
